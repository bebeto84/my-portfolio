<div class="rating-control" [attr.aria-busy]="!restored()">
  <p class="rating-caption">
    <strong><span aria-hidden="true">✦</span> Rate this work</strong>
    <span>Hover to preview, then click to choose 1–5 stars.</span>
  </p>
  <div
    class="rating-options"
    role="group"
    [attr.aria-label]="'Your rating for ' + itemLabel()"
    (mouseleave)="clearPreview()"
  >
    @for (rating of ratingValues; track rating) {
      <button
        type="button"
        [disabled]="!restored()"
        [attr.aria-label]="'Rate ' + itemLabel() + ' ' + rating + ' out of 5'"
        [attr.aria-pressed]="currentRating() === rating"
        [class.filled]="rating <= (displayedRating() ?? 0)"
        [class.previewed]="previewRating() !== null && rating <= (previewRating() ?? 0)"
        [class.picked]="currentRating() === rating"
        (mouseenter)="preview(rating)"
        (focus)="preview(rating)"
        (blur)="clearPreview()"
        (click)="setRating(rating)"
      >
        ★
      </button>
    }
  </div>
  @if (currentRating() !== null) {
    <button
      class="clear-rating"
      type="button"
      [disabled]="!restored()"
      (click)="clearRating()"
    >
      Clear rating
    </button>
  }
  @if (restored() && !storageAvailable()) {
    <p class="storage-note" role="status">
      Ratings are available for this tab but could not be saved for reload.
    </p>
  }
</div>

<div class="rating-control" [attr.aria-busy]="!restored()">
  <p class="rating-caption">
    <strong>Rate this work</strong>
    <span>Choose 1–5 stars · your rating is saved for this tab.</span>
  </p>
  <div class="rating-options" role="group" [attr.aria-label]="'Your rating for ' + itemLabel()">
    @for (rating of ratingValues; track rating) {
      <button
        type="button"
        [disabled]="!restored()"
        [attr.aria-label]="'Rate ' + itemLabel() + ' ' + rating + ' out of 5'"
        [attr.aria-pressed]="currentRating() === rating"
        [class.filled]="rating <= (currentRating() ?? 0)"
        (click)="setRating(rating)"
      >
        ★
      </button>
    }
  </div>
  @if (currentRating() !== null) {
    <button
      class="clear-rating"
      type="button"
      [disabled]="!restored()"
      (click)="clearRating()"
    >
      Clear rating
    </button>
  }
  @if (restored() && !storageAvailable()) {
    <p class="storage-note" role="status">
      Ratings are available for this tab but could not be saved for reload.
    </p>
  }
</div>
